<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monitor CEV • Supabase Teste</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Segoe UI,Arial,sans-serif;background:#0f3557}*{box-sizing:border-box}
#monitor{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f4f7fb;visibility:hidden}
#auth{position:fixed;inset:0;z-index:999999;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#123d63,#1b5c90)}
#auth.hidden{display:none}.box{width:min(410px,100%);background:#fff;border-radius:22px;padding:27px;box-shadow:0 26px 70px #0005;color:#173c54}.brand{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#1b5c90}.box h1{font-size:23px;margin:7px 0 5px}.sub{font-size:13px;color:#6b7d89;margin:0 0 20px}.field{margin:12px 0}.field label{display:block;font-size:11px;font-weight:900;margin-bottom:5px;text-transform:uppercase;color:#486273}.field input{width:100%;padding:12px;border:1px solid #cad6df;border-radius:10px;font-size:14px;outline:none}.field input:focus{border-color:#1b5c90;box-shadow:0 0 0 3px #1b5c9018}.primary{width:100%;padding:12px;border:0;border-radius:10px;background:#1b5c90;color:#fff;font-weight:900;cursor:pointer}.primary:disabled{opacity:.6}.status{min-height:20px;margin-top:11px;font-size:12px;font-weight:700;color:#5e7380}.status.err{color:#b52e2e}.status.ok{color:#167347}.hint{margin-top:14px;padding:10px;border-radius:10px;background:#f3f7f9;color:#72838d;font-size:10px;line-height:1.45}
#sessionBar{position:fixed;z-index:999998;right:12px;bottom:12px;display:none;align-items:center;gap:8px;padding:7px 9px;border-radius:999px;background:#102f49e8;color:#fff;box-shadow:0 7px 22px #0003;font-size:11px}#sessionBar.show{display:flex}#sessionBar b{font-size:11px}#sessionBar button{border:1px solid #ffffff44;background:#ffffff17;color:#fff;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:800;cursor:pointer}.db-dot{width:8px;height:8px;border-radius:50%;background:#f4b740;box-shadow:0 0 0 3px #f4b74022}.db-dot.ok{background:#37c978}.db-dot.err{background:#ef5f5f}
</style>
</head>
<body>
<iframe id="monitor" src="./index.html"></iframe>
<div id="auth">
  <div class="box">
    <div class="brand">Central Energética de Vicentina</div>
    <h1>🔐 Monitor CEV</h1>
    <p class="sub">Teste de autenticação + viagens centralizadas no Supabase.</p>
    <div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="username" placeholder="E-mail cadastrado no Supabase"></div>
    <div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password" placeholder="Sua senha"></div>
    <button id="login" class="primary">Entrar no Monitor</button>
    <div id="status" class="status">Aguardando login.</div>
    <div class="hint">Esta continua sendo uma cópia de teste. O index.html principal não foi alterado. Nesta versão, as viagens são sincronizadas com o banco online.</div>
  </div>
</div>
<div id="sessionBar"><span class="db-dot" id="dbDot"></span><span id="dbState">Conectando banco...</span><b id="who">-</b><button id="logout">Sair</button></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL='https://yyuqodhrterfrhoyhfut.supabase.co';
const SUPABASE_KEY='sb_publishable_jSWXE3-Ckzf8UNCWgbcM7w_rsgnXXdK';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id),frame=$('monitor'),auth=$('auth'),status=$('status'),login=$('login');
let profile=null,currentAuthUser=null,realtimeChannel=null,reloadTimer=null,syncTimer=null;
let knownIds=new Set();
let dbApplying=false;

function setStatus(t,type=''){status.textContent=t;status.className='status'+(type?' '+type:'')}
function setDbState(t,type=''){$('dbState').textContent=t;$('dbDot').className='db-dot'+(type?' '+type:'')}
function operatorName(p,user){if(p?.role==='admin')return 'Luciano';return String(p?.nome||user?.email?.split('@')[0]||'Operador').trim()}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function clone(v){return JSON.parse(JSON.stringify(v))}
function allTrips(snapshot){
  const groups=['active','completed','transfer','finalized'];
  const out=[];
  for(const group of groups){for(const j of (snapshot?.[group]||[])){if(j&&j.id!=null)out.push({group,j})}}
  return out;
}
function toIso(v){const n=Number(v);return Number.isFinite(n)&&n>0?new Date(n).toISOString():null}
function rowFromTrip(group,j){
  const statusMap={active:'EM_VIAGEM',completed:'CONCLUIDO',transfer:'EM_DESLOCAMENTO',finalized:'FINALIZADO'};
  const etapaMap={active:1,completed:2,transfer:3,finalized:4};
  const c=j.current||{};
  const last=Array.isArray(j.steps)&&j.steps.length?j.steps[j.steps.length-1]:{};
  return {
    monitor_id:String(j.id),
    frota:String(j.truck??j.frota??''),
    frente:j.front??j.frente??null,
    status:statusMap[group]||'EM_VIAGEM',
    etapa:etapaMap[group]||1,
    origem:c.origin??last.origin??null,
    destino:c.destination??last.destination??j.last??null,
    saida_em:toIso(c.start??last.start),
    chegada_em:toIso(c.actualEnd??last.actualEnd),
    previsao_chegada:toIso(c.end??last.end),
    tipo_caminhao:j.model??j.truckType??null,
    operador:j.user??window.__CEV_SUPABASE_USER__?.name??null,
    grupo:group,
    payload:clone(j),
    atualizado_por:currentAuthUser?.id??null,
    atualizado_em:new Date().toISOString()
  };
}

async function syncSnapshotNow(snapshot){
  if(dbApplying||!currentAuthUser||!snapshot)return;
  const trips=allTrips(snapshot);
  const currentIds=new Set(trips.map(x=>String(x.j.id)));
  const rows=trips.map(x=>rowFromTrip(x.group,x.j)).filter(r=>r.frota);
  const deleted=[...knownIds].filter(id=>!currentIds.has(id));
  setDbState('Salvando...', '');
  try{
    if(rows.length){
      const {error}=await supabase.from('journeys').upsert(rows,{onConflict:'monitor_id'});
      if(error)throw error;
    }
    if(deleted.length){
      const {error}=await supabase.from('journeys').delete().in('monitor_id',deleted);
      if(error)throw error;
    }
    knownIds=currentIds;
    setDbState('Banco sincronizado','ok');
  }catch(e){
    console.error('[CEV DB sync]',e);
    setDbState('Erro ao sincronizar','err');
  }
}
function queueSync(snapshot){
  clearTimeout(syncTimer);
  const copy=clone(snapshot);
  syncTimer=setTimeout(()=>syncSnapshotNow(copy),180);
}
window.CEV_DB={pushFromMonitor:queueSync};

function injectBridge(user,p){
  const name=operatorName(p,user);
  window.__CEV_SUPABASE_USER__={name,role:p.role,email:user.email,id:user.id};
  const w=frame.contentWindow,d=frame.contentDocument;
  w.__CEV_SUPABASE_USER__=window.__CEV_SUPABASE_USER__;
  const s=d.createElement('script');
  s.textContent=`(()=>{try{
    const p=window.__CEV_SUPABASE_USER__||{};
    const n=String(p.name||'Operador');
    if(typeof CREDENTIALS!=='undefined'&&!CREDENTIALS[n]){CREDENTIALS[n]='__SUPABASE_AUTH__';if(typeof refreshUserLists==='function')refreshUserLists()}
    if(typeof currentUser!=='undefined')currentUser=n;
    try{localStorage.setItem(UK,n);sessionStorage.setItem(SESSION_KEY,n)}catch(e){}
    if(typeof loginScreen!=='undefined')loginScreen.classList.add('hidden');
    if(typeof activeUser!=='undefined'){activeUser.value=n;activeUser.disabled=true;activeUser.onchange=null}
    if(typeof activeUserLabel!=='undefined')activeUserLabel.textContent=n;
    const __cevRawSave=save;
    window.__CEV_DB_EXPORT__=()=>JSON.parse(JSON.stringify({active:data.active||[],completed:data.completed||[],transfer:data.transfer||[],finalized:data.finalized||[]}));
    window.__CEV_DB_APPLY__=(rows)=>{
      const b={active:[],completed:[],transfer:[],finalized:[]};
      (rows||[]).forEach(r=>{if(b[r.grupo]&&r.payload)b[r.grupo].push(JSON.parse(JSON.stringify(r.payload)))});
      data.active=b.active;data.completed=b.completed;data.transfer=b.transfer;data.finalized=b.finalized;
      try{__cevRawSave()}catch(e){console.error('[CEV DB local save]',e)}
      try{if(typeof render==='function')render()}catch(e){console.error('[CEV DB render]',e)}
    };
    save=function(){__cevRawSave();try{setTimeout(()=>window.parent.CEV_DB?.pushFromMonitor(window.__CEV_DB_EXPORT__()),0)}catch(e){console.error('[CEV DB push]',e)}};
    if(typeof syncFloatingPermissions==='function')syncFloatingPermissions();
    if(typeof render==='function')render();
    document.documentElement.dataset.supabaseAuth='true';
    document.documentElement.dataset.supabaseSync='true';
  }catch(e){console.error('[CEV Supabase Bridge]',e)}})();`;
  d.body.appendChild(s);s.remove();
  const ls=d.getElementById('loginScreen');if(ls)ls.classList.add('hidden');
}

async function waitAndInject(user,p){
  for(let i=0;i<80;i++){
    try{
      if(frame.contentDocument?.readyState==='complete'&&frame.contentDocument?.body){injectBridge(user,p);return true}
    }catch(e){}
    await sleep(100);
  }
  throw new Error('O Monitor demorou demais para carregar.');
}

async function fetchRows(){
  const {data,error}=await supabase.from('journeys').select('monitor_id,grupo,payload,atualizado_em').order('criado_em',{ascending:true});
  if(error)throw error;
  return data||[];
}
async function applyDatabaseRows(rows){
  const fn=frame.contentWindow?.__CEV_DB_APPLY__;
  if(typeof fn!=='function')return;
  dbApplying=true;
  try{
    knownIds=new Set((rows||[]).map(r=>String(r.monitor_id)));
    fn(rows||[]);
    setDbState('Banco sincronizado','ok');
  }finally{setTimeout(()=>{dbApplying=false},80)}
}
async function reloadFromDatabase(){
  if(!currentAuthUser)return;
  try{const rows=await fetchRows();await applyDatabaseRows(rows)}
  catch(e){console.error('[CEV DB reload]',e);setDbState('Erro ao ler banco','err')}
}
function scheduleReload(){clearTimeout(reloadTimer);reloadTimer=setTimeout(reloadFromDatabase,180)}
function startRealtime(){
  if(realtimeChannel)supabase.removeChannel(realtimeChannel);
  realtimeChannel=supabase.channel('cev-monitor-journeys-'+crypto.randomUUID())
    .on('postgres_changes',{event:'*',schema:'public',table:'journeys'},()=>scheduleReload())
    .subscribe(state=>{
      if(state==='SUBSCRIBED')setDbState('Tempo real conectado','ok');
      else if(state==='CHANNEL_ERROR'||state==='TIMED_OUT')setDbState('Realtime com erro','err');
    });
}
async function initializeDatabaseSync(){
  setDbState('Carregando banco...','');
  const rows=await fetchRows();
  if(rows.length){
    await applyDatabaseRows(rows);
  }else{
    const local=frame.contentWindow?.__CEV_DB_EXPORT__?.();
    knownIds=new Set();
    if(allTrips(local).length)await syncSnapshotNow(local);
    else setDbState('Banco conectado • sem viagens','ok');
  }
  startRealtime();
  setInterval(()=>{if(!document.hidden)reloadFromDatabase()},15000);
}

async function unlockMonitor(user,p){
  profile=p;currentAuthUser=user;
  const name=operatorName(p,user);
  $('who').textContent=name+' • '+p.role;
  await waitAndInject(user,p);
  frame.style.visibility='visible';auth.classList.add('hidden');$('sessionBar').classList.add('show');
  await initializeDatabaseSync();
}
async function loadAuthorized(user){
  const {data:p,error}=await supabase.from('profiles').select('nome,role,ativo,email').eq('id',user.id).single();
  if(error)throw new Error('Não foi possível carregar seu perfil: '+error.message);
  if(!p?.ativo){await supabase.auth.signOut();throw new Error('Usuário desativado no Monitor CEV.');}
  await unlockMonitor(user,p);
}

login.addEventListener('click',async()=>{
  const email=$('email').value.trim(),password=$('password').value;
  if(!email||!password){setStatus('Informe e-mail e senha.','err');return}
  login.disabled=true;setStatus('Validando no Supabase...');
  try{
    const {data,error}=await supabase.auth.signInWithPassword({email,password});
    if(error)throw error;
    await loadAuthorized(data.user);
    $('password').value='';setStatus('Acesso liberado.','ok');
  }catch(e){setStatus('❌ '+(e?.message||String(e)),'err')}
  finally{login.disabled=false}
});
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login.click()});
$('logout').addEventListener('click',async()=>{if(realtimeChannel)await supabase.removeChannel(realtimeChannel);await supabase.auth.signOut();location.reload()});

(async()=>{
  const {data:{session}}=await supabase.auth.getSession();
  if(session?.user){setStatus('Restaurando sessão...');try{await loadAuthorized(session.user)}catch(e){setStatus('❌ '+e.message,'err')}}
})();
</script>
</body>
</html>
