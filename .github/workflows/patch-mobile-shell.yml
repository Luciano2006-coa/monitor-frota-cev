name: Apply safe mobile stylesheet

on:
  push:
    paths:
      - '.github/workflows/patch-mobile-shell.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject mobile stylesheet link
        run: python patch_mobile_shell.py
      - name: Commit index
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load CSS-only mobile design"
          git push
