<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monitor CEV • Espelho Oficial COA</title>
<script>
(()=>{
  const q=new URLSearchParams(location.search);
  const forceDesktop=q.get('desktop')==='1';
  const forceMobile=q.get('mobile')==='1';
  const smallScreen=window.matchMedia('(max-width: 820px)').matches;
  const mobileUA=/Android|iPhone|iPod|Mobile/i.test(navigator.userAgent||'');
  if(forceMobile||(!forceDesktop&&(smallScreen||mobileUA))){
    location.replace(new URL('./monitor-mobile.html',location.href).href);
  }
})();
</script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f3557}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>

</body>
</html>
