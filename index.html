<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f7f8">
<title>Monitor de Frota CEV</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#f3f7f8;font-family:Segoe UI,Arial,sans-serif}.boot{height:100%;display:grid;place-items:center;color:#315567}.boot div{text-align:center}.boot b{display:block;font-size:18px}.boot span{display:block;margin-top:7px;font-size:11px;color:#78909c}.spin{width:32px;height:32px;margin:0 auto 14px;border:3px solid #d7e5ea;border-top-color:#0b6b8e;border-radius:50%;animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="boot"><div><div class="spin"></div><b>Central Energética de Vicentina</b><span>Carregando Monitor de Frota...</span></div></div>
<script>
(async()=>{
  const q=new URLSearchParams(location.search);
  const forcedDesktop=q.get('desktop')==='1';
  const forcedMobile=q.get('mobile')==='1';
  const touchDevice=/Android|iPhone|iPad|iPod|Mobile|IEMobile|Opera Mini/i.test(navigator.userAgent||'');
  const narrow=matchMedia('(max-width:820px)').matches;
  const mobile=forcedMobile||(!forcedDesktop&&(narrow||touchDevice));
  const target=mobile?'./monitor-mobile.html?v=20261003-9':'./desktop.html?v=20261003-3';
  try{
    const r=await fetch(target,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const html=await r.text();
    document.open();document.write(html);document.close();
  }catch(e){
    console.error('[CEV router]',e);
    location.replace(target);
  }
})();
</script>
</body>
</html>
